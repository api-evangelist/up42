actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No WebSocket protocol surface exists. UP42's public API is request/response
    REST at https://api.up42.com, with asynchronous ordering, tasking, and
    processing observed by polling status or by outbound HTTPS webhooks. No
    AsyncAPI document was created because there is no server-push transport on
    UP42's own API to model.
