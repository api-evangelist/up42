  modeledNote: |
    Confirmed endpoints were verified directly against docs.up42.com /
    developer.up42.com (the create-order call, the /v2/assets storage surface,
    and the /v2/sas STAC data-management surface). Modeled endpoints correspond
    to named operations in the UP42 API reference (e.g. listcollectionsv2,
    estimatev2order, createv2orderunderworkspace, listtaskingquotation,
    listwebhooks) whose exact REST path and method were reconstructed from the
    documentation and the UP42 Python SDK; re-verify these against the live
    reference during reconciliation.
  ownership: |
    UP42 is a subsidiary of Airbus Defence and Space. Its marketplace hosts
    Airbus data (e.g. Pleiades, Pleiades Neo, SPOT) alongside many third-party
    data providers.
