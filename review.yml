aid: up42
name: UP42
review:
  question: Does UP42 expose a documented public WebSocket API?
  answer: false
  date: '2026-07-04'
  reviewer: API Evangelist
  asyncapiSpecCreated: false
  asyncapiScopeNote: |
    No AsyncAPI document was authored. UP42's public API surface at
    https://api.up42.com is request/response REST over HTTPS. There is no
    server-push transport (WebSocket or SSE) on UP42's own API to model.
    Asynchronous work - tasking acquisitions, catalog/tasking order
    fulfillment, and processing jobs - is tracked either by polling order/job
    status endpoints or by registering HTTPS webhooks that UP42 calls on
    order.status / job.status changes. Those webhooks are outbound
    server-to-endpoint HTTP callbacks, not a bidirectional WebSocket, so they
    are documented as REST resources rather than an AsyncAPI channel.
findings:
  summary: |
    UP42 does not publish a documented public WebSocket API. UP42 is a
    geospatial marketplace and developer platform for Earth observation data
    and analytics, operated by Airbus Defence and Space. Its documented public
    API is a REST API at https://api.up42.com, authenticated with an OAuth2
    Bearer access token obtained from a UP42 API key or account credentials via
    the UP42 auth server
    (https://auth.up42.com/realms/public/protocol/openid-connect/token,
    client_id up42-api). Access tokens are short-lived (~5 minutes). The API
    covers Catalog (archive search over STAC), Tasking (new acquisitions,
    feasibility, quotations), Orders (estimate/create/track), Storage Assets
    (list/download), a STAC-compliant data management surface (/v2/sas/...),
    Processing/analytics, and Webhooks. Long-running work is asynchronous and is
    observed by polling status or via outbound HTTPS webhooks. No realtime,
    bidirectional, or streaming WebSocket (ws:// or wss://) endpoint is
    documented on UP42's API.
  openSource: |
    UP42's platform/API is proprietary (operated by Airbus Defence and Space),
    but UP42 publishes an official open-source Python SDK and example
    repositories on GitHub (github.com/up42), including up42-py and
    up42-webhooks. The SDK wraps the same REST API documented here and is a
    common way to script catalog search, ordering, storage, and webhooks.
  transports:
    - protocol: REST
      scheme: https
      baseURL: https://api.up42.com
      documented: true
      note: The full public API - Catalog, Tasking, Orders, Storage Assets, STAC (/v2/sas), Processing, Webhooks, Workspaces.
    - protocol: OAuth2 Token
      scheme: https
      baseURL: https://auth.up42.com/realms/public/protocol/openid-connect/token
      documented: true
      note: Keycloak token endpoint (client_id up42-api). Exchange an API key or account credentials for a ~5 minute Bearer access token.
    - protocol: Webhook
      scheme: https
      documented: true
      note: UP42 POSTs order.status / job.status events to a registered HTTPS endpoint with a signed payload. Outbound HTTP callback, not WebSocket.
    - protocol: WebSocket
      scheme: wss
      documented: false
      note: No WebSocket endpoint is documented anywhere in the UP42 API reference or docs as of the review date.
