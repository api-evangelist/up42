aid: up42
url: https://raw.githubusercontent.com/api-evangelist/up42/refs/heads/main/apis.yml
name: UP42
kind: company
description: UP42 is a geospatial marketplace and developer platform for Earth
  observation (EO) data and analytics, operated by Airbus Defence and Space. It lets
  you search a global archive of satellite and aerial imagery (Catalog), task new
  satellite acquisitions on demand (Tasking), place and track Orders, store and
  download results as cloud-native Assets, and browse everything through a
  STAC-compliant data management API. Delivery, ordering, and storage are exposed
  over a documented REST API at https://api.up42.com, authenticated with OAuth2
  access tokens (obtained from an API key or account credentials), and are also
  wrapped by an official Python SDK. Storage is powered by STAC and the
  cloud-native asset model, and job/order status changes can be pushed to consumer
  endpoints via webhooks.
