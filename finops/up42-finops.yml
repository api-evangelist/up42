description: >-
  FinOps view of UP42 spend. UP42 bills on a prepaid credit model (100 credits =
  1 EUR; credits valid two years). There is no per-request API fee - cost is
  driven by what you order: archive (catalog) imagery charged per km2 of the
  selected area of interest, tasking acquisitions quoted per project, storage of
  delivered assets, and processing/analytics charged by the spatial extent of the
  selected STAC item. Because charges accrue at order and processing time,
  cost control centers on estimating before ordering, scoping the area of interest
  tightly, and (on enterprise accounts) using budgets to cap credit spend per
  workspace.
notes: >-
  Per-km2 and per-project rates depend on the data provider and collection; verify
  on the UP42 pricing page and via the estimate-order and process-validation
  endpoints. UP42 is operated by Airbus Defence and Space.
