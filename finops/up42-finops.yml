principles:
- name: Visibility
  description: Estimate every order and validate every process before running; track credit spend per workspace, collection, and order.
- name: Allocation
  description: Scope orders and processing to workspaces so credit spend maps to teams, projects, and cost centers.
- name: Optimization
  description: Tighten the area of interest, prefer archive over tasking when timeliness allows, and reuse stored assets and STAC search instead of re-ordering.
- name: Accountability
  description: Use enterprise budgets to cap workspace credit spend and assign owners who review credit burn against the prepaid balance.
